server:
  # Hosting platforms (Render, Cloud Run, ...) inject PORT.
  port: ${PORT:8080}

spring:
  application:
    name: harbormaster
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Prometheus scrape endpoint is always on (/actuator/prometheus). Distributed
  # tracing is opt-in so the zero-config demo stays quiet and dependency-free;
  # the observability compose profile flips TRACING_ENABLED=true and points the
  # OTLP exporter at its collector.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

harbormaster:
  source:
    # SIMULATION (default): deterministic scripted North Sea scenario, encoded
    #   as real AIVDM sentences — zero configuration, every detector fires.
    # REPLAY: loops the bundled real capture from the Norwegian coast.
    # LIVE_TCP: streams the Norwegian Coastal Administration's open feed
    #   (run with --harbormaster.source.mode=LIVE_TCP).
    # KAFKA: consumes raw NMEA from a topic as a consumer group. With
    #   produce-simulation=true it also publishes the scripted feed, so the
    #   mode is a self-contained demo (see the `kafka` compose profile).
    mode: SIMULATION
    simulation:
      # North Sea approaches west of Rotterdam — the Dutch coast frames the
      # eastern edge of the picture.
      center-lat: 52.2
      center-lon: 3.8
      vessel-count: 120
      seed: 20260709
    replay:
      file: classpath:data/ais-replay-sample.ndjson.gz
      speed: 1.0
      loop: true
    live-tcp:
      host: 153.44.253.27
      port: 5631
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: ${KAFKA_TOPIC:ais.nmea}
      group-id: ${KAFKA_GROUP_ID:harbormaster}
      # In the demo profile the backend both produces and consumes; in a real
      # deployment set this false and let edge receivers own the producing.
      produce-simulation: ${KAFKA_PRODUCE_SIMULATION:false}

  tracking:
    # Demo-friendly windows. For live shore-station coverage, prefer
    # coast-after: 3m / lost-after: 10m / evict-after: 60m — real coverage
    # has natural holes that shorter windows would misread as "going dark".
    coast-after: 90s
    lost-after: 300s
    evict-after: 1800s
    trail-length: 50

  detection:
    kinematic:
      max-speed-knots: 60
      cooldown: 5m
    dark-ship:
      min-sog-knots: 3.0
    loitering:
      window: 10m
      max-sog-knots: 1.0
      cooldown: 15m
    rendezvous:
      max-distance-m: 300
      min-duration: 3m
      pair-cooldown: 30m

logging:
  level:
    io.harbormaster: INFO
